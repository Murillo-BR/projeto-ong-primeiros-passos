<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Cliente</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Início</a>
      <a href="projetos.html">Projetos</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main>
    <h1>Cadastre-se</h1>

    <form>
      <fieldset>
        <legend>Dados Pessoais</legend>

        <div>
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div>
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="phone">Telefone</label>
          <input type="tel" pattern="\([0-9]{2}\)[0-9]{5}-[0-9]{4}"
           placeholder="(00)00000-0000" id="phone" name="phone" required>
        </div>

        <div>
          <label for="documento">CPF</label>
          <input type="text" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
           placeholder="000.000.000-00" id="documento" name="cpf" title="Formato: 000.000.000-00" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div>
          <label for="rua">Rua / Avenida</label>
          <input type="text" id="rua" name="endereco" required>
        </div>

        <div>
          <label for="numero">Número da Residência</label>
          <input type="text" id="numero" name="numero" required>
        </div>

        <div>
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento">
        </div>

        <div>
          <label for="cep">CEP</label>
          <input type="text" pattern="[0-9]{5}-[0-9]{3}"
           placeholder="00000-000" id="cep" name="cep" title="Formato: 00000-000" required>
        </div>

        <div>
          <label for="estado">Estado</label>
          <input type="text" id="estado" name="state" required>
        </div>

        <div>
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="city" required>
        </div>
      </fieldset>

      <div class="alerta">
        <span>Ops, ainda falta alguma informação em seu cadastro.</span>
        <button type="button" class="alerta-fechar">×</button>
      </div>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    <h2>Fale Conosco</h2>
    <p>Telefone, WhatsApp, E-mail.</p>
  </footer>

  <div class="toast">Cadastro enviado com sucesso!</div>
</body>
</html>
